<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA LINK V15.1 - TV IR</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at top,#123,#020711 70%);
  color:white;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}
#app{width:100vw;height:100vh;position:relative}
video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  opacity:.38;
}
canvas{
  position:absolute;
  width:100%;
  height:100%;
  pointer-events:none;
}
.topbar{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  z-index:20;
}
.badge{
  background:rgba(0,255,255,.12);
  border:1px solid #00ffff;
  border-radius:16px;
  padding:10px 14px;
  box-shadow:0 0 18px #00ffff66;
  font-weight:bold;
}
button{
  border:none;
  border-radius:18px;
  padding:16px 22px;
  font-size:18px;
  font-weight:bold;
}
#connect{
  background:#00ffff;
  color:#001018;
}
.screen{
  position:absolute;
  inset:0;
  display:none;
  z-index:10;
}
.screen.active{display:block}
.menuGrid{
  position:absolute;
  inset:110px 30px 40px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:22px;
}
.tile,.remoteBtn{
  background:rgba(0,30,55,.72);
  border:2px solid #00ffff;
  box-shadow:0 0 18px #00ffff66,inset 0 0 18px #00ffff22;
  border-radius:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:28px;
  font-weight:bold;
  backdrop-filter:blur(8px);
}
.tile.activeTarget,.remoteBtn.activeTarget{
  background:rgba(255,140,0,.85);
  border-color:#ffcc00;
  box-shadow:0 0 35px #ff9900;
}
.remote{
  position:absolute;
  inset:90px 20px 30px;
}
.remoteBtn{
  position:absolute;
  width:30vw;
  height:18vh;
}
.on{left:2vw;top:2vh}
.off{right:2vw;top:2vh}
.chp{left:2vw;top:30vh}
.chm{left:2vw;top:55vh}
.volp{right:2vw;top:30vh}
.volm{right:2vw;top:55vh}
.back{
  left:35vw;
  bottom:2vh;
  width:30vw;
  height:12vh;
  font-size:22px;
}
.centerLabel{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:220px;
  height:220px;
  border:2px solid #00ffff;
  border-radius:50%;
  box-shadow:0 0 35px #00ffff88,inset 0 0 35px #00ffff44;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#00ffff;
  background:rgba(0,20,35,.35);
}
.progress{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  width:55%;
  height:14px;
  border:1px solid #00ffff;
  border-radius:20px;
  overflow:hidden;
  z-index:30;
}
#bar{
  width:0%;
  height:100%;
  background:#ff9900;
  box-shadow:0 0 18px #ff9900;
}
</style>
</head>

<body>
<div id="app">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="topbar">
    <div class="badge">AURA LINK V15.1 — TV IR</div>
    <button id="connect" onclick="connectBluetooth()">Connexion Bluetooth</button>
  </div>

  <section id="home" class="screen active">
    <div class="menuGrid">
      <div class="tile" data-action="tv">📺<br>Regarder<br>la télévision</div>
      <div class="tile">💡<br>Lumière</div>
      <div class="tile">🥤<br>Boire</div>
      <div class="tile">🌬️<br>J’ai chaud</div>
    </div>
  </section>

  <section id="tv" class="screen">
    <div class="remote">
      <div class="remoteBtn on" data-cmd="p">ON</div>
      <div class="remoteBtn off" data-cmd="p">OFF</div>

      <div class="remoteBtn chp" data-cmd="C">CHAÎNE +</div>
      <div class="remoteBtn chm" data-cmd="c">CHAÎNE -</div>

      <div class="remoteBtn volp" data-cmd="V">VOLUME +</div>
      <div class="remoteBtn volm" data-cmd="v">VOLUME -</div>

      <div class="remoteBtn back" data-back="home">RETOUR</div>

      <div class="centerLabel">VISAGE<br>RADAR<br>LASER</div>
    </div>
  </section>

  <div class="progress"><div id="bar"></div></div>
</div>

<script>
const VERSION = "V15.1 TV IR";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const bar = document.getElementById("bar");

let bleCharacteristic = null;
let laserX = window.innerWidth / 2;
let laserY = window.innerHeight / 2;
let currentTarget = null;
let targetStart = 0;
let currentScreen = "home";

const HOLD_TIME = 3000;

// Commandes Bluetooth vers Arduino
const COMMANDS = {
  POWER: "p",      // validé écran ENI : protocole NEC adresse 0x20 commande 0x52 côté Arduino
  CH_PLUS: "C",   // à coder plus tard
  CH_MINUS: "c",  // à coder plus tard
  VOL_PLUS: "V",  // à coder plus tard
  VOL_MINUS: "v"  // à coder plus tard
};

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

async function connectBluetooth(){
  try{
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:[
        "0000ffe0-0000-1000-8000-00805f9b34fb",
        "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
      ]
    });

    const server = await device.gatt.connect();
    let service, characteristic;

    try{
      service = await server.getPrimaryService("0000ffe0-0000-1000-8000-00805f9b34fb");
      characteristic = await service.getCharacteristic("0000ffe1-0000-1000-8000-00805f9b34fb");
    }catch(e){
      service = await server.getPrimaryService("6e400001-b5a3-f393-e0a9-e50e24dcca9e");
      characteristic = await service.getCharacteristic("6e400002-b5a3-f393-e0a9-e50e24dcca9e");
    }

    bleCharacteristic = characteristic;
    document.getElementById("connect").textContent = "Bluetooth OK";
  }catch(err){
    alert("Erreur Bluetooth : " + err);
  }
}

async function sendBT(cmd){
  if(!bleCharacteristic){
    alert("Bluetooth non connecté");
    return;
  }
  const data = new TextEncoder().encode(cmd);
  await bleCharacteristic.writeValue(data);
  pulseLabel("Commande envoyée : " + cmd);
}

function pulseLabel(txt){
  console.log(txt);
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  currentScreen = id;
  resetTarget();
}

function resetTarget(){
  if(currentTarget) currentTarget.classList.remove("activeTarget");
  currentTarget = null;
  targetStart = 0;
  bar.style.width = "0%";
}

function getTargets(){
  if(currentScreen === "home"){
    return [...document.querySelectorAll("#home .tile")];
  }
  if(currentScreen === "tv"){
    return [...document.querySelectorAll("#tv .remoteBtn")];
  }
  return [];
}

function detectTarget(){
  const targets = getTargets();
  let found = null;

  for(const el of targets){
    const r = el.getBoundingClientRect();
    if(laserX >= r.left && laserX <= r.right && laserY >= r.top && laserY <= r.bottom){
      found = el;
      break;
    }
  }

  if(found !== currentTarget){
    resetTarget();
    currentTarget = found;
    if(currentTarget){
      currentTarget.classList.add("activeTarget");
      targetStart = performance.now();
    }
  }

  if(currentTarget){
    const elapsed = performance.now() - targetStart;
    const pct = Math.min(100, elapsed / HOLD_TIME * 100);
    bar.style.width = pct + "%";

    if(elapsed >= HOLD_TIME){
      activate(currentTarget);
      resetTarget();
    }
  }
}

function activate(el){
  if(el.dataset.action === "tv"){
    showScreen("tv");
    return;
  }

  if(el.dataset.back === "home"){
    showScreen("home");
    return;
  }

  if(el.dataset.cmd){
    sendBT(el.dataset.cmd);
  }
}

function drawRadar(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const cx = canvas.width/2;
  const cy = canvas.height/2;
  const r = 115;

  ctx.strokeStyle = "rgba(0,255,255,.75)";
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx,cy,r*0.65,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx-r,cy);
  ctx.lineTo(cx+r,cy);
  ctx.moveTo(cx,cy-r);
  ctx.lineTo(cx,cy+r);
  ctx.stroke();

  ctx.strokeStyle = "rgba(0,255,255,.9)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.lineTo(laserX,laserY);
  ctx.stroke();

  ctx.fillStyle = "#ff9900";
  ctx.shadowColor = "#ff9900";
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.arc(laserX,laserY,10,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function animate(){
  drawRadar();
  detectTarget();
  requestAnimationFrame(animate);
}

const faceMesh = new FaceMesh({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces:1,
  refineLandmarks:true,
  minDetectionConfidence:0.5,
  minTrackingConfidence:0.5
});

faceMesh.onResults(results=>{
  if(results.multiFaceLandmarks && results.multiFaceLandmarks.length){
    const lm = results.multiFaceLandmarks[0];

    // nez : point 1
    const nose = lm[1];

    // vidéo miroir : on inverse X pour garder gauche = gauche réel écran
    const nx = 1 - nose.x;
    const ny = nose.y;

    const gainX = 2.3;
    const gainY = 2.0;

    laserX = window.innerWidth/2 + (nx - 0.5) * window.innerWidth * gainX;
    laserY = window.innerHeight/2 + (ny - 0.5) * window.innerHeight * gainY;

    laserX = Math.max(0, Math.min(window.innerWidth, laserX));
    laserY = Math.max(0, Math.min(window.innerHeight, laserY));
  }
});

const camera = new Camera(video,{
  onFrame: async()=>{ await faceMesh.send({image:video}); },
  width:640,
  height:480
});

camera.start();
animate();
</script>
</body>
</html>
